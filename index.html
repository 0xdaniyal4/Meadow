      (function() {
        try {
          const origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if (obj === window) {
              try {
                if (descriptor && typeof descriptor === 'object') {
                  descriptor.configurable = true;
                }
                return origDefineProperty.call(this, obj, prop, descriptor);
              } catch (e) {
                console.warn('Prevented window property redefinition error:', prop, e);
                return obj;
              }
            }
            return origDefineProperty.apply(this, arguments);
          };

          window.addEventListener('error', function(e) {
            if (e.message && (e.message.includes('Cannot redefine property') || e.message.includes('ethereum'))) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          }, true);
        } catch (err) {
          console.warn('Polyfill error:', err);
        }
      })();
    </script>
